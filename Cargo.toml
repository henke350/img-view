[package]
name = "img-view"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
eframe = "0.37.0"
egui = "0.37"
image = "0.25.10"
rfd = "0.18.0"

# Image decoding is painfully slow unoptimized; optimize dependencies even in debug builds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
